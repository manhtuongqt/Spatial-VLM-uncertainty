relation_semantics:
  left_of: smaller image u at the frozen VIEW_POSE
  right_of: larger image u at the frozen VIEW_POSE
  above: smaller image v at the frozen VIEW_POSE
  below: larger image v at the frozen VIEW_POSE
  front_of: smaller positive optical depth at the frozen VIEW_POSE
  behind: larger positive optical depth at the frozen VIEW_POSE
  inside: full 3D AABB is contained by container_inner_dimensions in base_link
  near: AABB surface distance is at most near_threshold_m

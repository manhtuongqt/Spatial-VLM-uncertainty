schema_version: 1
protocol_id: gazebo_calibration_v1
frozen_before_capture: true
parent_family_count: 128
split_parent_family_count:
  calibration: 128
state_quota:
  calibration:
    FOUND: 32
    AMBIGUOUS: 32
    ABSENT: 32
    INSUFFICIENT_EVIDENCE: 32
relation_variant_quota:
  calibration:
    leftmost: 32
    rightmost: 32
    second_from_left: 32
    second_from_right: 32
state_relation_cell_quota:
  calibration: 8
layout_uniqueness:
  full_pose_signatures_unique: true
  no_pose_signature_overlap_with_prior_uq_attempts: true
  byte_identical_rgb_forbidden: true
  perceptual_near_duplicate_rule:
    metric: whole-frame grayscale mean absolute difference and changed-pixel fraction
    gray_absdiff_threshold_for_changed_pixel: 3
    near_duplicate_if_gray_mad_below: 0.05
    and_changed_pixel_fraction_below: 0.002
reference_frame: image_viewer_left_to_right
horizontal_coordinate: normalized_centroid_x
tie_margin_normalized: 0.03
min_visible_evidence_px: 120
insufficient_evidence_rule:
  min_visible_pixels_inclusive: 1
  max_visible_pixels_exclusive: 120
  projected_center_outer_margin_fraction: 0.2
output_contract:
  point_regex: ^POINT \[\(([0-9]*\.?[0-9]+), ([0-9]*\.?[0-9]+)\)\]$
  abstain_literal: ABSTAIN
  allowed_actions:
  - POINT
  - ABSTAIN
  point_state: FOUND
  abstain_states:
  - AMBIGUOUS
  - ABSENT
  - INSUFFICIENT_EVIDENCE
camera:
  frame: camera_color_optical_frame
  base_frame: base_link
  resolution:
  - 640
  - 480
  intrinsics:
    fx: 606.0816650391
    fy: 605.7973022461
    cx: 325.5436706543
    cy: 249.9961547852
  view_joint_pose:
  - 1.3815
  - -1.8273
  - 1.3428
  - -1.2863
  - -1.5708
  - -1.9601
  depth_unit: metre
  valid_depth_range_m:
  - 0.1
  - 2.0
family_split_rule:
  all_variants_same_parent_same_split: true
  identical_rendered_scene_queries_share_parent_family: true
  co_locate:
  - views
  - paraphrases
  - visibility_variants
  - counterfactuals
  - queries_over_identical_layout
model_input_allowlist:
- rgb
- depth_m
- instruction
evaluator_only:
- semantic_labels
- answerability_state
- target_id
- candidate_set
- scene_layout
policies:
  no_sam2: true
  no_training: true
  no_model_inference: false
  no_materialization: false
  no_b2: true
  no_test_access: true
  no_dev_v2_fit_or_selection: true
  no_robot_manipulation: true
  full_train_uq_only_after_pilot_pass: true
  no_model_inference_during_capture: true
  no_materialization_before_128_of_128_geometry_pass: true
  no_grounding_or_risk_estimator_refit: true
full_dataset_only_after_pilot:
  protocol_id: gazebo_train_uq_v2_pilot_r6
  required_geometry_qc: 32/32 PASS
inference_lock:
  backbone: B0
  greedy_decoding: true
  max_new_tokens: 40
  stochastic_draws: 3
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  seed_rule: sha256(protocol_id:sample_id:model_id:draw)[0:4]
  self_consistency_is_calibrated_probability: false
risk_feature_schema:
- b0_action_one_hot
- b0_exact_contract
- b0_self_consistency
- stochastic_point_dispersion
- predicted_x
- predicted_y
- distance_to_image_boundary
- local_depth_valid_fraction
- local_depth_median
- local_depth_mad
- instruction_relation_one_hot

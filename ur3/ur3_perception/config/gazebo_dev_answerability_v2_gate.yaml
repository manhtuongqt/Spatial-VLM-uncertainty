schema_version: 1
protocol_id: gazebo_dev_answerability_v2
frozen_before_capture: true
split: dev
parent_family_count: 64
state_quota:
  FOUND: 16
  AMBIGUOUS: 16
  ABSENT: 16
  INSUFFICIENT_EVIDENCE: 16
relation_variant_quota:
  leftmost: 16
  rightmost: 16
  second_from_left: 16
  second_from_right: 16
focus_object_quota_min:
  ycb_apple: 16
  ycb_orange: 16
  mango: 16
reference_frame: image_viewer_left_to_right
horizontal_coordinate: normalized_centroid_x
tie_margin_normalized: 0.03
min_visible_evidence_px: 120
insufficient_evidence_rule:
  min_visible_pixels_inclusive: 1
  max_visible_pixels_exclusive: 120
  projected_center_outer_margin_fraction: 0.2
output_contract:
  point_regex: ^POINT \[\(([0-9]*\.?[0-9]+), ([0-9]*\.?[0-9]+)\)\]$
  abstain_literal: ABSTAIN
  allowed_actions:
  - POINT
  - ABSTAIN
  point_state: FOUND
  abstain_states:
  - AMBIGUOUS
  - ABSENT
  - INSUFFICIENT_EVIDENCE
promotion_rule:
  requires_b1_found_hit_strictly_higher: true
  requires_b1_safe_task_accuracy_strictly_higher: true
  requires_no_exact_format_regression: true
max_sensor_spread_sec: 0.02
camera:
  frame: camera_color_optical_frame
  base_frame: base_link
  resolution:
  - 640
  - 480
  intrinsics:
    fx: 606.0816650391
    fy: 605.7973022461
    cx: 325.5436706543
    cy: 249.9961547852
  view_joint_pose:
  - 1.3815
  - -1.8273
  - 1.3428
  - -1.2863
  - -1.5708
  - -1.9601
  depth_unit: metre
  valid_depth_range_m:
  - 0.1
  - 2.0
family_split_rule:
  all_variants_same_parent_same_split: true
  co_locate:
  - views
  - paraphrases
  - visibility_variants
  - counterfactuals
model_input_allowlist:
- rgb
- depth_m
- instruction
evaluator_only:
- semantic_labels
- target_id
- target_mask
- context_ids
- candidate_set
- answerability_state
- scene_layout
- camera_to_world
no_sam2: true
b2_opened: false
test_iid_ood_access: false
